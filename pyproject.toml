[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otterai"]

[project]
name = "otterai-py"
version = "0.1.0"
description = "Unofficial Python API and live recorder for Otter.ai"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "requests-toolbelt>=1.0.0",
    "sounddevice>=0.5.1",
    "websocket-client>=1.8.0",
]

[project.scripts]
otterai = "otterai.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black"]
